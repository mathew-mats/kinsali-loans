<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – Kinsali Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0a5c36 0%, #00b894 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px 35px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-card .logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #0a5c36;
            margin-bottom: 4px;
        }
        .login-card .logo i { color: #f7931e; }
        .login-card .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .login-card .form-control {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
        }
        .login-card .form-control:focus {
            border-color: #0a5c36;
            box-shadow: 0 0 0 3px rgba(10,92,54,0.1);
        }
        .login-card .btn-primary {
            background: linear-gradient(135deg, #0a5c36 0%, #00b894 100%);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .login-card .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(10,92,54,0.3);
        }
        .login-card .back-link {
            text-align: center;
            margin-top: 16px;
        }
        .login-card .back-link a {
            color: #6c757d;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .login-card .back-link a:hover { color: #0a5c36; }
        .alert { border-radius: 12px; font-size: 0.9rem; padding: 10px 16px; }
        .badge-admin {
            background: rgba(247,147,30,0.15);
            color: #f7931e;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        @media (max-width: 576px) {
            .login-card { padding: 20px; }
            .login-card .logo { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-card" style="padding: 30px 35px; max-width: 400px; width: 100%;">
        <div class="logo">
            <i class="fas fa-hand-holding-usd"></i> Kinsali
            <span class="badge-admin ms-2">ADMIN</span>
        </div>
        <p class="subtitle">
            <i class="fas fa-user-shield me-1"></i> Admin Access Only
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size: 0.85rem;">
                    <i class="fas fa-user me-1"></i> Username
                </label>
                <input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size: 0.85rem;">
                    <i class="fas fa-lock me-1"></i> Password
                </label>
                <input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt me-2"></i> Login to Admin Panel
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'loans:home' %}">
                <i class="fas fa-arrow-left me-1"></i> Back to Website
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
